  revision: 503e754207c94da6bb26850b4469f367c9ea3582
  dtype: bfloat16
  frozen: true
  trust_remote_code: true
  attn_implementation: sdpa

representation:
  # BrainBridge paper layer numbering is 1-based.
  # layer 18 == output of model.llm.model.layers[17].
  production_layers: [18]
  diagnostic_layers: [9, 18, 27, 36]
  hidden_dim: 4096

temporal:
  tr: 1.49
  chunk_length: 8.0
  seconds_before_chunk: 4.0

video:
  frames_per_tr: 2
  resize_width: 448
