audio:
  sample_rate: 16000

pooling:
  target_region: target_tr
  temporal_mapping: proportional_valid_token_crop
  statistics: [mean, sample_std]

storage:
  dtype: float16
  pca: false

diagnostics:
  # Set >0 only for a pilot. Token states are large.
  token_states_per_movie: 0

runtime:
  # Tuned for 4 CPU cores / 32 GB RAM / RTX PRO 6000 Blackwell 96 GB.
  # One movie remains resident at a time; GPU batching is preferred over
  # CPU-side parallelism on this machine.
  inference_batch_size: 8
  cpu_threads: 2
  cpu_interop_threads: 1
  max_input_length: 8192
  max_slice_nums: 1
  use_cache: false
